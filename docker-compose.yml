services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cashflow
      POSTGRES_PASSWORD: cashflow
    # Instância única hospedando os bancos lógicos "lancamentos" e "consolidado" (ADR-003) —
    # criados pelo script abaixo no primeiro start do container.
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    # Broker de referência local (ADR-004/ADR-005) — Azure Service Bus na arquitetura-alvo.
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  lancamentos-api:
    build:
      context: .
      dockerfile: src/Lancamentos/Lancamentos.Api/Dockerfile
    ports:
      - "5101:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__LancamentosDb: "Host=postgres;Port=5432;Database=lancamentos;Username=cashflow;Password=cashflow"
      RabbitMq__HostName: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  consolidado-api:
    build:
      context: .
      dockerfile: src/Consolidado/Consolidado.Api/Dockerfile
    ports:
      - "5102:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ConsolidadoDb: "Host=postgres;Port=5432;Database=consolidado;Username=cashflow;Password=cashflow"
      RabbitMq__HostName: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
