services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Instância única hospedando os bancos lógicos "lancamentos" e "consolidado" (ADR-003) —
    # criados pelo script abaixo no primeiro start do container.
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    # Broker de referência local (ADR-004/ADR-005) — Azure Service Bus na arquitetura-alvo.
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  lancamentos-api:
    build:
      context: .
      dockerfile: src/Lancamentos/Lancamentos.Api/Dockerfile
    ports:
      - "5101:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__LancamentosDb: "Host=postgres;Port=5432;Database=lancamentos;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      # Aplica migrations do EF Core no startup (issue #8) — seguro aqui porque depends_on
      # garante o Postgres saudável antes do container subir; ver comentário em Program.cs.
      Database__MigrateOnStartup: "true"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  consolidado-api:
    build:
      context: .
      dockerfile: src/Consolidado/Consolidado.Api/Dockerfile
    ports:
      - "5102:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ConsolidadoDb: "Host=postgres;Port=5432;Database=consolidado;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      # Aplica migrations do EF Core no startup (issue #12) — mesmo racional do serviço
      # Lançamentos, ver comentário em Program.cs.
      Database__MigrateOnStartup: "true"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
